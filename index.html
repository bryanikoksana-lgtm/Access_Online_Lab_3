<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access Online Lab</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#263345;background:#f3f5f8}header{background:#a4262c;color:white;padding:16px 24px;display:flex;align-items:center;gap:20px}header b{font-size:24px}header small{opacity:.9}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d4d9e1;background:white;border-radius:7px;padding:9px 12px;color:#263345}button:hover{background:#fce9eb;border-color:#a4262c}button.primary{background:#a4262c;color:white;border-color:#a4262c}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;background:white;border-bottom:1px solid #ddd}main{display:grid;grid-template-columns:240px 1fr;min-height:75vh}aside{background:#e9edf3;padding:16px;border-right:1px solid #d5dbe4}aside button{display:block;width:100%;text-align:left;margin:5px 0}aside h4{margin:20px 0 7px;color:#697386;font-size:12px;text-transform:uppercase}section{padding:24px;min-width:0}h2{margin:0 0 15px}h3{margin:15px 0}input,select,textarea{padding:8px;border:1px solid #cbd2dc;border-radius:5px;background:white;max-width:100%}table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #dce1e8;padding:8px;text-align:left}th{background:#e9edf3}td input,td select{width:100%;min-width:75px;border:0;background:transparent}tr:nth-child(even){background:#fafbfc}.scroll{overflow:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.panel{background:white;border:1px solid #dce1e8;border-radius:12px;padding:18px;margin:12px 0}.muted{color:#667085}footer{padding:10px 20px;background:#fff;border-top:1px solid #ddd}label{display:block;margin:10px 0}label input,label select{margin-left:8px}.cards{display:flex;gap:15px;flex-wrap:wrap}.cards .panel{min-width:210px}dialog{border:0;border-radius:12px;box-shadow:0 10px 60px #0005;max-width:90vw}dialog::backdrop{background:#0005} @media(max-width:700px){main{grid-template-columns:1fr}aside{border:0}section{padding:12px}} @media print{header,nav,aside,footer,.bar,.no-print{display:none!important}main{display:block}section{padding:0}}
.designer{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:12px}.canvas{position:relative;background-image:radial-gradient(#aab4c1 1px,transparent 1px);background-size:12px 12px;border:1px solid #aab4c1;overflow:hidden}.canvas.preview{background-image:none}.control{position:absolute;display:flex;align-items:center;gap:6px;padding:3px;overflow:hidden;cursor:move;border:1px dashed #b4bdc9;touch-action:none}.control.chosen{outline:2px solid #a4262c;z-index:3}.preview .control{border:0;cursor:default;touch-action:auto}.control input,.control select{min-width:0;flex:1;width:100%;padding:4px}.control button{width:100%;padding:4px}.control.outlined{border:1px solid currentColor}.sample{background:#eef1f5;border:1px solid #b4bdc9;padding:4px;flex:1}.properties{margin:0;padding:12px}.properties label{font-size:12px}.properties input,.properties select{display:block;width:100%;margin:3px 0}.qgrid td{min-width:155px}.qgrid th{white-space:nowrap}.window{border:1px solid #a4262c;background:white;max-width:max-content}.window-title{background:#a4262c;color:white;padding:8px 12px;display:flex;justify-content:space-between}.reportpaper{background:white;padding:20px;overflow:auto}.reportrow{break-inside:avoid;border:0;border-bottom:1px solid #ddd}.grouphead{background:#e9edf3;padding:8px}pre{white-space:pre-wrap;background:#e9edf3;padding:12px}@media(max-width:900px){.designer{grid-template-columns:1fr}}@media print{.reportpaper{padding:0;overflow:visible}.reportrow{max-width:100%}}
 .qarea{height:350px;min-height:180px;resize:vertical;overflow:auto;position:relative;background:white;border:1px solid #aab2bf}.qtable{position:absolute;width:185px;border:1px solid #a4262c;background:#fff;z-index:1}.qtitle{background:#f4f1f1;border-bottom:1px solid #aaa;text-align:center;padding:7px;cursor:move;touch-action:none}.qtitle button{padding:0 5px;float:right}.qfield{padding:3px 12px;font-size:13px;cursor:pointer}.qfield:hover{background:#f6dce0}.qscroll{overflow:auto;border-top:5px solid #9a94a9;margin-top:8px;background:white}.qgrid3{width:max-content;table-layout:fixed;font-size:13px}.qgrid3 th{width:120px;min-width:120px;text-align:right;position:sticky;left:0;background:#f5f5f5;z-index:2;font-weight:400}.qgrid3 td{width:155px;min-width:155px;max-width:155px;background:white}.qgrid3 td,.qgrid3 th{height:26px;padding:0 3px;border:1px solid #c5cbd7}.qgrid3 input,.qgrid3 select{font-size:13px;padding:2px;min-width:0;border-radius:0}.qgrid3 input[type=checkbox]{display:block;width:15px;margin:auto}.qgrid3 button{padding:0 6px;font-size:12px}.qgrid3 input:focus,.qgrid3 select:focus{outline:1px solid #a4262c}
</style><header><b>▤ Access Online Lab 3.0</b><small>Інтерактивна лабораторія баз даних</small></header><nav id="nav"></nav><main><aside id="side"></aside><section id="work"></section></main><footer id="status">Готово</footer><dialog id="dlg"></dialog><input type="file" id="file" accept=".json" hidden><script>
const $=id=>document.getElementById(id), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), types=['Автонумерація','Короткий текст','Довгий текст','Число','Дата','Грошовий','Так/Ні','Список'];
const field=(name,type='Короткий текст',pk=false,options='')=>({name,type,pk,options});
const demo=()=>({name:'Електронна бібліотека',tables:[{name:'Книги',fields:[field('ID','Автонумерація',true),field('Назва'),field('Автор'),field('Жанр','Список',false,'Роман,Повість,Поезія,Оповідання,Драма'),field('Рік','Число'),field('Доступна','Так/Ні')],rows:[[1,'Кобзар','Тарас Шевченко','Поезія',1840,true],[2,'Захар Беркут','Іван Франко','Повість',1883,true],[3,'Тигролови','Іван Багряний','Роман',1944,false],[4,'Місто','Валер’ян Підмогильний','Роман',1928,true]]},{name:'Читачі',fields:[field('ID','Автонумерація',true),field('Ім’я'),field('Клас')],rows:[[1,'Олена','9-А'],[2,'Андрій','9-Б']]},{name:'Видача',fields:[field('ID','Автонумерація',true),field('КнигаID','Число'),field('ЧитачID','Число'),field('Дата','Дата')],rows:[[1,3,1,'2026-11-20']]}],rels:[{a:0,af:0,b:2,bf:1},{a:1,af:0,b:2,bf:2}],queries:[],forms:[],reports:[]});
let db;try{db=JSON.parse(localStorage.getItem('accesslab-v1'))||demo()}catch{db=demo()}let active=0,view='table',obj=0,filter='',sort=-1,desc=false;const save=()=>{try{localStorage.setItem('accesslab-v1',JSON.stringify(db));$('status').textContent='Збережено у браузері · '+db.name}catch{$('status').textContent='Не вдалося зберегти локально — експортуйте JSON'}};const btn=(s,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${s}</button>`;const set=(v,i=0)=>{if(v!==view||i!==obj){mode='design';selected=-1}view=v;obj=i;filter='';sort=-1;render()};const openTable=i=>{active=i;set('table')};const t=()=>db.tables[active];const opts=(arr,sel)=>arr.map((x,i)=>`<option value="${i}" ${i==sel?'selected':''}>${E(x)}</option>`).join('');
function render(){ $('nav').innerHTML=[['＋ Нова база','newDB()'],['📂 Відкрити','$ (\'file\').click()'],['💾 Експорт JSON','download()'],['＋ Таблиця','newTable()'],['⚙ Конструктор','set(\'design\')'],['▤ Таблиця','set(\'table\')'],['🔗 Зв’язки','set(\'rels\')'],['🔎 Запит','newObject(\'queries\')'],['▣ Форма','newObject(\'forms\')'],['▧ Звіт','newObject(\'reports\')'],['🎓 Завдання','set(\'help\')']].map(x=>btn(...x)).join('');$('side').innerHTML=`<b>${E(db.name)}</b><h4>Таблиці</h4>`+db.tables.map((x,i)=>btn('▤ '+E(x.name),`openTable(${i})`,i===active&&['table','design'].includes(view)?'primary':'')).join('')+['queries','forms','reports'].map((k,i)=>`<h4>${['Запити','Форми','Звіти'][i]}</h4>`+db[k].map((x,j)=>btn(E(x.name),`set('${k}',${j})`)).join('')).join(''); if(view==='help')return help();if(view==='rels')return rels();if(['queries','forms','reports'].includes(view))return objectView();if(!t()){$('work').innerHTML='<h2>Створіть першу таблицю</h2>'+btn('＋ Таблиця','newTable()');return}if(view==='design')return design();tableView()}
function inputCell(f,v,action){let a=`onchange="${action}"`;if(f.type==='Так/Ні')return `<input type="checkbox" ${v?'checked':''} ${a}>`;if(f.type==='Список')return `<select ${a}><option value=""></option>${f.options.split(',').map(x=>`<option ${x.trim()===v?'selected':''}>${E(x.trim())}</option>`).join('')}</select>`;return `<input ${a} type="${f.type==='Дата'?'date':['Число','Грошовий','Автонумерація'].includes(f.type)?'number':'text'}" value="${E(f.type==='Дата'?String(v??'').slice(0,10):v)}" ${f.type==='Автонумерація'?'readonly':''} step="any">`}
function valid(){for(const a of db.tables){for(let j=0;j<a.fields.length;j++)if(a.fields[j].pk){let seen=new Set;for(const r of a.rows){let k=String(r[j]??'');if(!k||seen.has(k))return 'Первинний ключ має бути непорожнім та унікальним: '+a.name;seen.add(k)}}}for(const r of db.rels){let a=db.tables[r.a],b=db.tables[r.b];if(!a||!b)continue;for(const row of b.rows){let v=row[r.bf];if(v!==''&&v!=null&&!a.rows.some(x=>String(x[r.af])===String(v)))return 'Порушення зв’язку: '+b.name}}return ''}
function change(ti,ri,fi,el){let a=db.tables[ti],old=a.rows[ri][fi],f=a.fields[fi];a.rows[ri][fi]=f.type==='Так/Ні'?el.checked:['Число','Грошовий'].includes(f.type)&&el.value!==''?Number(el.value):el.value;let err=valid();if(err){a.rows[ri][fi]=old;alert(err);render()}else save()}
function addRow(i=active){let a=db.tables[i];let r=a.fields.map((f,j)=>f.type==='Автонумерація'?Math.max(0,...a.rows.map(x=>Number(x[j])||0))+1:f.type==='Так/Ні'?false:'');a.rows.push(r);save();render()}
function delRow(i,j){if(!confirm('Видалити запис?'))return;let a=db.tables[i],r=a.rows.splice(j,1)[0],err=valid();if(err){a.rows.splice(j,0,r);alert(err)}save();render()}
function tableView(){let a=t(),rows=a.rows.map((r,i)=>({r,i})).filter(x=>x.r.some(v=>String(v).toLowerCase().includes(filter.toLowerCase())));if(sort>=0)rows.sort((x,y)=>String(x.r[sort]).localeCompare(String(y.r[sort]),'uk',{numeric:true})*(desc?-1:1));$('work').innerHTML=`<h2>▤ ${E(a.name)}</h2><div class="bar">${btn('＋ Запис','addRow()','primary')}${btn('Конструктор','set(\'design\')')}${btn('CSV','csv(active)')}${btn('Видалити таблицю','deleteTable()')}<input placeholder="Пошук у записах" value="${E(filter)}" onchange="filter=this.value;tableView()"></div><div class="scroll"><table><tr><th>№</th>${a.fields.map((f,j)=>`<th onclick="desc=sort===${j}?!desc:false;sort=${j};tableView()" style="cursor:pointer">${f.pk?'🔑 ':''}${E(f.name)} ↕</th>`).join('')}<th></th></tr>${rows.map(({r,i})=>`<tr><td>${i+1}</td>${a.fields.map((f,j)=>`<td>${inputCell(f,r[j],`change(${active},${i},${j},this)`)}</td>`).join('')}<td>${btn('×',`delRow(${active},${i})`)}</td></tr>`).join('')}</table></div><p class="muted">Записів: ${rows.length} / ${a.rows.length} · Натисніть заголовок для сортування.</p>`}
function newDB(){let n=prompt('Назва нової бази:');if(!n)return;if(!confirm('Поточну базу буде замінено. Експортуйте її за потреби. Продовжити?'))return;db={name:n,tables:[],rels:[],queries:[],forms:[],reports:[]};active=0;save();set('table')}
function newTable(){let n=prompt('Назва таблиці:');if(!n)return;if(db.tables.some(x=>x.name===n))return alert('Назва вже існує');db.tables.push({name:n,fields:[field('ID','Автонумерація',true)],rows:[]});active=db.tables.length-1;save();set('design')}
function deleteTable(){if(!confirm('Видалити таблицю та її залежні об’єкти?'))return;db.tables.splice(active,1);db.rels=db.rels.filter(r=>r.a!==active&&r.b!==active).map(r=>({...r,a:r.a>active?r.a-1:r.a,b:r.b>active?r.b-1:r.b}));for(let k of ['queries','forms','reports'])db[k]=db[k].filter(o=>o.table!==active).map(o=>({...o,table:o.table>active?o.table-1:o.table}));active=0;save();set('table')}
function design(){let a=t();$('work').innerHTML=`<h2>Конструктор · ${E(a.name)}</h2><div class="bar">${btn('＋ Поле','addField()','primary')}${btn('Перейменувати','renameTable()')}${btn('Режим таблиці','set(\'table\')')}</div><div class="scroll"><table><tr><th>Ключ</th><th>Назва поля</th><th>Тип даних</th><th>Значення списку (через кому)</th><th></th></tr>${a.fields.map((f,i)=>`<tr><td><input type="radio" name="pk" ${f.pk?'checked':''} onchange="keyField(${i})"></td><td><input value="${E(f.name)}" onchange="editField(${i},'name',this.value)"></td><td><select onchange="editField(${i},'type',this.value)">${types.map(x=>`<option ${x===f.type?'selected':''}>${x}</option>`).join('')}</select></td><td><input value="${E(f.options)}" onchange="editField(${i},'options',this.value)"></td><td>${btn('×',`removeField(${i})`)}</td></tr>`).join('')}</table></div><p class="muted">Оберіть тип даних та первинний ключ. Зміна типу не конвертує наявні записи.</p>`}
function renameTable(){let n=prompt('Нова назва',t().name);if(n&&!db.tables.some(x=>x.name===n)){t().name=n;save();render()}}
function addField(){let n=prompt('Назва поля');if(!n||t().fields.some(x=>x.name===n))return;t().fields.push(field(n));t().rows.forEach(r=>r.push(''));save();render()}
function editField(i,k,v){if(k==='name'&&(!v||t().fields.some((f,j)=>j!==i&&f.name===v)))return render();if(k==='type'&&t().rows.length&&!confirm('Зміна типу не перетворює старі значення. Продовжити?'))return render();t().fields[i][k]=v;save();render()}
function keyField(i){let old=t().fields.map(f=>f.pk);t().fields.forEach((f,j)=>f.pk=j===i);let err=valid();if(err){t().fields.forEach((f,j)=>f.pk=old[j]);alert(err)}save();render()}
function removeField(i){if(t().fields.length===1||db.rels.some(r=>r.a===active&&r.af===i||r.b===active&&r.bf===i))return alert('Спочатку видаліть зв’язки; таблиця має містити поле.');if(!confirm('Видалити поле та його дані?'))return;t().fields.splice(i,1);t().rows.forEach(r=>r.splice(i,1));db.rels.forEach(r=>{if(r.a===active&&r.af>i)r.af--;if(r.b===active&&r.bf>i)r.bf--});for(let k of ['queries','forms','reports'])db[k]=db[k].filter(o=>o.table!==active);save();render()}
function rels(){let names=db.tables.map(x=>x.name);$('work').innerHTML=`<h2>🔗 Зв’язки між таблицями</h2><div class="cards">${db.tables.map(a=>`<div class="panel"><b>${E(a.name)}</b><hr>${a.fields.map(f=>`<div>${f.pk?'🔑 ':''}${E(f.name)} <small class="muted">${E(f.type)}</small></div>`).join('')}</div>`).join('')}</div><div class="panel">${db.rels.map((r,i)=>`<div class="bar"><b>${E(db.tables[r.a].name)}.${E(db.tables[r.a].fields[r.af].name)}</b> 1 ───── ∞ <b>${E(db.tables[r.b].name)}.${E(db.tables[r.b].fields[r.bf].name)}</b>${btn('Видалити',`db.rels.splice(${i},1);save();render()`)}</div>`).join('')} ${names.length?`<h3>Новий зв’язок</h3><div class="bar"><select id="ra" onchange="relFields()">${opts(names,0)}</select><select id="raf"></select> 1 → ∞ <select id="rb" onchange="relFields()">${opts(names,Math.min(1,names.length-1))}</select><select id="rbf"></select>${btn('Створити','addRel()','primary')}</div>`:''}</div>`;if(names.length)relFields()}
function relFields(){for(let p of ['a','b'])$('r'+p+'f').innerHTML=opts(db.tables[+$('r'+p).value].fields.map(f=>f.name),0)}
function addRel(){let r={a:+$('ra').value,af:+$('raf').value,b:+$('rb').value,bf:+$('rbf').value};if(r.a===r.b||!db.tables[r.a].fields[r.af].pk)return alert('Оберіть первинний ключ іншої таблиці');db.rels.push(r);let err=valid();if(err){db.rels.pop();alert(err)}save();render()}
function newObject(k){if(!db.tables.length)return alert('Спочатку створіть таблицю');let n=prompt('Назва об’єкта');if(!n)return;db[k].push({name:n,table:active,fields:t().fields.map((_,i)=>i),criterion:0,op:'',value:'',sort:0,descending:false,color:'#ffffff',size:16,align:'left',record:0});save();set(k,db[k].length-1)}
function objectView(){let o=db[view][obj];if(!o)return set('table');let a=db.tables[o.table];let settings=`<div class="panel no-print"><b>Налаштування</b><label>Джерело: <select onchange="sourceChange(this.value)">${opts(db.tables.map(x=>x.name),o.table)}</select></label><div class="bar">${a.fields.map((f,i)=>`<label><input type="checkbox" ${o.fields.includes(i)?'checked':''} onchange="toggleField(${i},this.checked)"> ${E(f.name)}</label>`).join('')}</div>${btn('Видалити об’єкт','deleteObject()')}</div>`;let html=`<h2>${E(o.name)}</h2>`+settings;if(view==='queries'){let rows=a.rows.filter(r=>match(r[o.criterion],o.op,o.value)).sort((x,y)=>String(x[o.sort]).localeCompare(String(y[o.sort]),'uk',{numeric:true})*(o.descending?-1:1));html+=`<div class="panel"><div class="bar"><select onchange="config('criterion',+this.value)">${opts(a.fields.map(f=>f.name),o.criterion)}</select><select onchange="config('op',this.value)">${['','=', '≠','>','<','містить'].map(x=>`<option value="${E(x)}" ${x===o.op?'selected':''}>${E(x||'Без умови')}</option>`).join('')}</select><input value="${E(o.value)}" placeholder="Критерій" onchange="config('value',this.value)"></div><div class="bar">Сортування: <select onchange="config('sort',+this.value)">${opts(a.fields.map(f=>f.name),o.sort)}</select><label><input type="checkbox" ${o.descending?'checked':''} onchange="config('descending',this.checked)"> За спаданням</label>${btn('▶ Виконати','render()','primary')}</div></div>${result(a,o,rows)}<p>Знайдено: ${rows.length}</p>`}else if(view==='forms'){let j=Math.min(o.record,Math.max(0,a.rows.length-1)),r=a.rows[j];html+=`<div class="bar">${btn('◀','config(\'record\',Math.max(0,'+j+'-1))')}${btn('▶','config(\'record\',Math.min('+Math.max(0,a.rows.length-1)+','+j+'+1))')}${btn('＋ Новий запис',`formAdd(${o.table})`,'primary')}${r?btn('Видалити запис',`delRow(${o.table},${j})`):''} Запис ${r?j+1:0} з ${a.rows.length}</div><div class="bar">Колір <input type="color" value="${E(o.color)}" onchange="config('color',this.value)"> Розмір <input type="number" min="12" max="32" value="${o.size}" onchange="config('size',Math.max(12,Math.min(32,+this.value)))"> <select onchange="config('align',this.value)">${['left','center','right'].map((x,i)=>`<option value="${x}" ${x===o.align?'selected':''}>${['Ліворуч','По центру','Праворуч'][i]}</option>`).join('')}</select></div><div class="panel" style="background:${E(o.color)};font-size:${o.size}px;text-align:${E(o.align)}">${r?o.fields.map(i=>`<label>${E(a.fields[i].name)} ${inputCell(a.fields[i],r[i],`change(${o.table},${j},${i},this)`)}</label>`).join(''):'Немає записів'}</div>`}else{html+=`<div class="bar">${btn('🖨 Друк / PDF','print()','primary')}</div><div class="panel">${result(a,o,a.rows)}<p>Усього записів: ${a.rows.length}</p></div>`}$('work').innerHTML=html}
function match(v,op,k){if(!op)return true;let s=String(v??'').toLowerCase(),z=k.toLowerCase();if(op==='=')return s===z;if(op==='≠')return s!==z;if(op==='містить')return s.includes(z);let n=Number(s),m=Number(z);return op==='>'?(!isNaN(n)&&!isNaN(m)?n>m:s>z):(!isNaN(n)&&!isNaN(m)?n<m:s<z)}
function result(a,o,rows){return `<div class="scroll"><table><tr>${o.fields.map(i=>`<th>${E(a.fields[i].name)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${o.fields.map(i=>`<td>${E(typeof r[i]==='boolean'?(r[i]?'Так':'Ні'):r[i])}</td>`).join('')}</tr>`).join('')}</table></div>`}

function criteriaSQL(ref,c){c=c.trim();if(!c)return '';if(/^(IS\s+(NOT\s+)?NULL|BETWEEN\b|IN\s*\(|LIKE\b|NOT\s+LIKE\b|[<>=!])/i.test(c)){let m=c.match(/^([<>=!]+)\s*(.*)$/);if(m&&!/^['"\d+-]|^(NULL|TRUE|FALSE)$/i.test(m[2]))c=m[1]+lit(m[2]);return ref+' '+c}return ref+' = '+(/^[-+]?\d+(\.\d+)?$/.test(c)||/^['"]/.test(c)?c:lit(c))}
function makeSQL(o){let g=o.grid.filter(x=>x.ref),cols=g.filter(x=>x.show).map(x=>refSQL(x.ref)+(x.alias?' AS '+qid(x.alias):''));if(!cols.length)cols=['*'];let joined=[o.sources[0]],from=qid(db.tables[joined[0]].name);for(let i of o.sources.slice(1)){let r=db.rels.find(r=>(r.a===i&&joined.includes(r.b))||(r.b===i&&joined.includes(r.a)));from+=r?' INNER JOIN '+qid(db.tables[i].name)+' ON '+refSQL(r.a+':'+r.af)+' = '+refSQL(r.b+':'+r.bf):' CROSS JOIN '+qid(db.tables[i].name);joined.push(i)}let where=['criteria','or'].map(k=>g.filter(x=>x[k].trim()).map(x=>criteriaSQL(refSQL(x.ref),x[k])).join(' AND ')).filter(Boolean).map(s=>'('+s+')').join(' OR ');let order=g.filter(x=>x.sort).map(x=>refSQL(x.ref)+' '+x.sort).join(', ');return 'SELECT '+cols.join(', ')+'\nFROM '+from+(where?'\nWHERE '+where:'')+(order?'\nORDER BY '+order:'')+';'}

const baseCriteria=criteriaSQL;
function paramToken(s){return ':p_'+Array.from(new TextEncoder().encode(s),v=>v.toString(16).padStart(2,'0')).join('');}
criteriaSQL=function(ref,c){c=c.trim();let m=c.match(/^(?:(>=|<=|<>|!=|=|>|<|LIKE)\s*)?\[([^\]]+)\]$/i);if(m)return ref+' '+(m[1]||'=')+' '+paramToken(m[2]);if(/^is null$/i.test(c))return '('+ref+' IS NULL OR '+ref+" = '')";if(/^is not null$/i.test(c))return '('+ref+' IS NOT NULL AND '+ref+" <> '')";c=c.replace(/\bDate\(\)/gi,"date('now','localtime')").replace(/\bLIKE\s+(["'])(.*?)\1/gi,(_,q,s)=>'LIKE '+lit(s.replaceAll('*','%').replaceAll('?','_')));if(/^[<>=!]+\s*date\(/i.test(c))return ref+' '+c;return baseCriteria(ref,c)};
const oldMakeSQL=makeSQL;
makeSQL=function(o){normalizeQ(o);let g=o.grid.filter(c=>c.ref);let sql=oldMakeSQL(o); // extend base SELECT with totals and extra OR rows

function prepareParams(sql){let values=new Map();let re=/'(?:''|[^'])*'|"(?:""|[^"])*"|\[[^\]]*\]|:p_([0-9a-f]+)/gi;let cancelled=false;let out=sql.replace(re,(s,h)=>{if(!h)return s;let label=new TextDecoder().decode(Uint8Array.from(h.match(/../g),v=>parseInt(v,16)));if(!values.has(label)){let v=prompt(label);if(v===null){cancelled=true;return 'NULL'}values.set(label,v)}let v=values.get(label);return /^[-+]?\d+(\.\d+)?$/.test(v)?v:lit(v)});return cancelled?null:out}
runSQL=async function(sql,target=$('sqlresult')){let s=prepareParams(sql);if(s===null){target.textContent='Виконання скасовано';return}return originalRunSQL(s,target)};
